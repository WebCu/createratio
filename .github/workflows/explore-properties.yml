name: Explore lifecycle properties

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explore:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout (v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up pinned Node.js (v7.1.0)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.3
      - name: Run lifecycle properties with fresh seeds
        env:
          CR_PROPERTY_CASES: '16'
          CR_PROPERTY_STEPS: '240'
        run: |
          for run in $(seq 1 10); do
            seed=$(od -An -N4 -tu4 /dev/urandom | tr -d ' ')
            echo "Exploring seed $seed"
            CR_PROPERTY_SEED="$seed" node --test extension/src/tests/lifecycle-properties.test.js
          done
