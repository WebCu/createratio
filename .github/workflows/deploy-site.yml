name: Deploy website

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy website
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-site-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
      AWS_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - name: Checkout (v4.4.0)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Set up pinned pnpm (v6.1.0)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.11.2
      - name: Set up pinned Node.js (v7.1.0)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Install from the committed lockfile
        run: pnpm install --frozen-lockfile
      - name: Build website
        run: node site/build.js
      - name: Prepare public files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/site"
          cp dist/site/* "$RUNNER_TEMP/site/"
      - name: Check tested commit is still latest main
        id: freshness
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node bin/deployment-guard.js
      - name: Validate deployment settings
        if: steps.freshness.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for setting in AWS_REGION AWS_ROLE_ARN AWS_S3_BUCKET AWS_CLOUDFRONT_DISTRIBUTION_ID; do
            if [[ -z "${!setting:-}" ]]; then
              echo "::error::Set $setting in the production environment variables."
              exit 1
            fi
          done
      - name: Authenticate with AWS using OIDC (v4.3.1)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        if: steps.freshness.outputs.publish == 'true'
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-createratio-${{ github.run_id }}
      - name: Upload website
        if: steps.freshness.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          aws s3 sync "$RUNNER_TEMP/site/" "s3://$AWS_S3_BUCKET/" \
            --cache-control 'public,max-age=300,must-revalidate' \
            --no-progress --only-show-errors
      - name: Refresh CloudFront and wait for propagation
        if: steps.freshness.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          invalidation_id=$(aws cloudfront create-invalidation \
            --distribution-id "$AWS_CLOUDFRONT_DISTRIBUTION_ID" \
            --paths '/*' --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "$AWS_CLOUDFRONT_DISTRIBUTION_ID" \
            --id "$invalidation_id"
