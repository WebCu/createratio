name: createratio-dev

services:
  web:
    image: node:24.22.2-alpine3.23@sha256:9b69af715c7f9d038150b54ccccbaeffa9064bbc93e2904c29591ca097316af1
    working_dir: /srv/www
    command: node /srv/dev-server.js /srv/www
    environment:
      HOST: '0.0.0.0'
    user: '65534:65534'
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./site/dev-server.js:/srv/dev-server.js:ro
      - ./site/index.html:/srv/www/index.html:ro
      - ./site/privacy.html:/srv/www/privacy.html:ro
      - ./site/terms.html:/srv/www/terms.html:ro
      - ./site/llms.txt:/srv/www/llms.txt:ro
      - ./site/robots.txt:/srv/www/robots.txt:ro
      - ./site/sitemap.xml:/srv/www/sitemap.xml:ro
      - ./site/styles.css:/srv/www/styles.css:ro
      - ./site/arrival.js:/srv/www/arrival.js:ro
      - ./site/browser-install.js:/srv/www/browser-install.js:ro
      - ./site/analytics.js:/srv/www/analytics.js:ro
      - ./site/favicon.svg:/srv/www/favicon.svg:ro
      - ./LICENSE:/srv/www/LICENSE:ro
    ports:
      - '127.0.0.1:${WEB_PORT:-4173}:4173'
    labels:
      traefik.enable: 'false'
